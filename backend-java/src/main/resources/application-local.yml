# 本地 IDE 调试：开发库跑在内网服务器（不使用本机 Docker）。
# 先建立隧道：ssh -N -L 13306:127.0.0.1:13306 srv
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/prism?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: prism
    password: prism

prism:
  environment: development
  api-token: local-dev-token
