spring:
  application:
    name: prism-agent-java
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  mvc:
    async:
      # SSE 长连接不允许被容器默认 30s 超时切断
      request-timeout: -1
  datasource:
    url: ${PRISM_DB_URL:jdbc:mysql://127.0.0.1:3307/prism?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${PRISM_DB_USER:prism}
    password: ${PRISM_DB_PASSWORD:prism}
    hikari:
      maximum-pool-size: ${PRISM_DB_POOL_SIZE:10}
      pool-name: prism-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

prism:
  environment: ${PRISM_ENVIRONMENT:development}
  api-prefix: ${PRISM_API_PREFIX:/api/v1}
  api-token: ${PRISM_API_TOKEN:}
  service-name: ${PRISM_SERVICE_NAME:PrismAgentKit API}
  version: ${PRISM_VERSION:1.4.0}
  model-name: ${PRISM_MODEL_NAME:deepseek-chat}
  worker-concurrency: ${PRISM_WORKER_CONCURRENCY:2}
  max-steps: ${PRISM_MAX_STEPS:10}
  remote-tool-timeout-seconds: ${PRISM_REMOTE_TOOL_TIMEOUT_SECONDS:300}
  sse-heartbeat-seconds: ${PRISM_SSE_HEARTBEAT_SECONDS:15}

server:
  port: ${PRISM_PORT:8080}

management:
  endpoints:
    web:
      base-path: /internal/actuator
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
