spring:
  application:
    name: prism-agent-java
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always

server:
  port: ${PRISM_PORT:8080}

management:
  endpoints:
    web:
      base-path: /internal/actuator
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
