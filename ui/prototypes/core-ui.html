<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prism · Core UI 演示原型</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #fff;
        --soft: #f0f2f5;
        --text: #18212f;
        --muted: #596477;
        --line: #dce1e8;
        --brand: #4f46e5;
        --tint: #eeecff;
        --on: #fff;
      }
      [data-theme='dark'] {
        color-scheme: dark;
        --bg: #111318;
        --panel: #191c23;
        --soft: #22262f;
        --text: #eaecf2;
        --muted: #a2aaba;
        --line: #343b48;
        --brand: #a6a1ff;
        --tint: #282344;
        --on: #17132d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.7 system-ui,
          sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      button,
      select,
      textarea {
        font: inherit;
        color: inherit;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 8px;
        padding: 8px 12px;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 3px;
      }
      .demo {
        padding: 8px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .demo small {
        margin-right: auto;
        color: var(--muted);
      }
      .app {
        height: calc(100dvh - 64px);
        min-height: 500px;
        display: flex;
      }
      aside {
        width: 232px;
        flex-shrink: 0;
        padding: 24px 16px;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .logo {
        font-weight: 650;
        font-size: 20px;
        letter-spacing: -0.6px;
      }
      .logo span {
        display: inline-grid;
        place-items: center;
        width: 29px;
        height: 29px;
        background: var(--brand);
        color: var(--on);
        border-radius: 8px;
        margin-right: 9px;
      }
      .primary {
        background: var(--brand);
        color: var(--on);
        border-color: transparent;
      }
      .selected {
        color: var(--brand);
        background: var(--tint);
        border-color: transparent;
        text-align: left;
      }
      .label {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 1.5px;
      }
      .bottom {
        margin-top: auto;
      }
      main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 18px 28px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      header strong {
        margin-right: auto;
      }
      .status {
        font-size: 12px;
        color: var(--muted);
      }
      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--brand);
        margin-right: 7px;
      }
      .body {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .chat {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .messages {
        overflow: auto;
        flex: 1;
        padding: 36px max(24px, calc((100% - 690px) / 2));
      }
      .intro {
        padding: 45px 0;
      }
      h1 {
        font-size: 30px;
        font-weight: 550;
        letter-spacing: -1px;
        margin: 12px 0;
      }
      p {
        margin: 10px 0;
      }
      .muted {
        color: var(--muted);
      }
      .user {
        margin: 0 0 36px 20%;
        background: var(--soft);
        border-radius: 14px 14px 3px 14px;
        padding: 14px 18px;
      }
      .answer {
        line-height: 1.9;
      }
      .assistant {
        color: var(--brand);
        font-size: 12px;
        font-weight: 650;
        margin-bottom: 12px;
      }
      .tool {
        margin-top: 24px;
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .composer {
        margin: 12px 28px 24px;
        padding: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 15px;
      }
      textarea {
        resize: none;
        display: block;
        width: 100%;
        border: 0;
        background: transparent;
        min-height: 65px;
        padding: 8px;
      }
      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 8px;
      }
      .inspector {
        width: 300px;
        padding: 26px 22px;
        border-left: 1px solid var(--line);
        background: var(--panel);
        overflow: auto;
      }
      .inspector h2 {
        font-size: 15px;
        margin: 0 0 24px;
      }
      dl {
        font-size: 12px;
      }
      dt {
        color: var(--muted);
        margin-top: 18px;
      }
      dd {
        margin: 4px 0;
        overflow-wrap: anywhere;
      }
      code {
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
      dialog {
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 32px;
        width: min(520px, calc(100% - 32px));
      }
      dialog::backdrop {
        background: #0007;
      }
      .steps {
        color: var(--brand);
        font-size: 12px;
      }
      .dialog-actions {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
      }
      .mobile {
        display: none;
      }
      @media (max-width: 1199px) {
        .inspector {
          width: 260px;
        }
        aside {
          width: 200px;
        }
      }
      @media (max-width: 767px) {
        aside,
        .inspector {
          display: none;
        }
        .mobile {
          display: inline-block;
        }
        .demo {
          padding: 8px;
        }
        header {
          padding: 12px;
        }
        .composer {
          margin: 10px 12px;
        }
        .messages {
          padding: 24px 18px;
        }
        h1 {
          font-size: 26px;
        }
        .app {
          height: calc(100dvh - 115px);
        }
        aside.open,
        .inspector.open {
          display: flex;
          position: fixed;
          z-index: 3;
          background: var(--panel);
          top: 115px;
          bottom: 0;
          left: 0;
          width: min(85vw, 300px);
          box-shadow: 0 0 0 100vmax #0006;
        }
        .inspector.open {
          display: block;
          left: auto;
          right: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="demo">
      <small>演示原型 · 所有内容为演示数据，不连接 Backend</small>
      <select id="scenario" aria-label="演示状态">
        <option value="complete">正常对话</option>
        <option value="empty">空会话</option>
        <option value="streaming">输出中</option>
        <option value="waiting">外部工具等待</option>
        <option value="failed">执行失败</option>
      </select>
      <button id="theme">切换深浅主题</button><button id="guide">连接引导</button>
    </div>
    <div class="app">
      <aside id="nav">
        <div class="logo"><span>◇</span>Prism</div>
        <button class="primary" id="new">＋ 新建会话</button>
        <div class="label">会话</div>
        <button class="selected">Core 的第一步</button><button>了解 Agent 的运行过程</button>
        <div class="bottom muted">⚙ 连接与外观</div>
        <button class="mobile" id="closeNav">关闭导航</button>
      </aside>
      <main>
        <header>
          <button class="mobile" id="navToggle">会话</button><strong>Core 的第一步</strong
          ><span class="status"><span class="dot"></span>演示连接</span
          ><button id="details">执行详情</button>
        </header>
        <div class="body">
          <section class="chat" aria-label="对话">
            <div class="messages" id="messages"></div>
            <div class="composer">
              <textarea aria-label="消息" placeholder="向 Prism 描述你想完成的事…"></textarea>
              <div class="actions">
                <small class="muted">Enter 发送 · Shift + Enter 换行</small
                ><button class="primary" id="send">发送 ↑</button>
              </div>
            </div>
          </section>
          <section class="inspector" id="inspector" hidden>
            <h2>执行详情</h2>
            <span class="label">当前运行</span>
            <dl>
              <dt>状态</dt>
              <dd id="runStatus">已完成</dd>
              <dt>模型</dt>
              <dd>演示模型</dd>
              <dt>执行步数</dt>
              <dd>1</dd>
              <dt>运行 ID</dt>
              <dd><code>run_demo_core_001</code></dd>
            </dl>
            <p class="muted">此处按需展示实际运行与工具事件，不占用默认对话空间。</p>
            <button id="closeDetails">收起详情</button>
          </section>
        </div>
      </main>
    </div>
    <dialog id="wizard" aria-labelledby="guideTitle">
      <p class="steps" id="steps"></p>
      <h1 id="guideTitle"></h1>
      <p class="muted" id="guideBody"></p>
      <div class="tool">
        <code>/api/v1</code>
        <p>演示服务路径</p>
      </div>
      <div class="dialog-actions">
        <button id="later">暂时关闭</button><button class="primary" id="next">下一步</button>
      </div>
    </dialog>
    <script>
      // 原型交互只切换演示状态，不发送任何网络请求。
      const scenario = document.querySelector('#scenario')
      const messages = document.querySelector('#messages')
      const inspector = document.querySelector('#inspector')
      const nav = document.querySelector('#nav')
      const wizard = document.querySelector('#wizard')
      let step = 0
      const states = {
        complete: [
          '已完成',
          '我已经准备好了。你可以从一个问题开始，也可以描述一件想完成的事。执行过程和工具信息会在需要时呈现，让对话保持清晰。',
        ],
        streaming: ['正在生成', '我正在梳理这个问题，从当前 Core 已具备的能力开始… ▍'],
        waiting: ['等待外部工具结果', '已请求外部工具，收到宿主返回后会继续执行。'],
        failed: [
          '执行失败',
          '本次运行未能完成。你可以查看执行详情中的错误信息，保留输入后再次发送。',
        ],
      }
      function render() {
        messages.replaceChildren()
        if (scenario.value === 'empty') {
          const intro = document.createElement('div')
          intro.className = 'intro'
          intro.innerHTML =
            '<div class="assistant">PRISM / CORE</div><h1>让想法，从这里开始。</h1><p class="muted">一个专注的对话空间。把过程留在需要的时候。</p>'
          messages.append(intro)
          return
        }
        const [status, answer] = states[scenario.value]
        const user = document.createElement('div')
        user.className = 'user'
        user.textContent = '你好，介绍一下我们如何开始。'
        const assistant = document.createElement('div')
        assistant.className = 'assistant'
        assistant.textContent = '◇ PRISM'
        const body = document.createElement('p')
        body.className = 'answer'
        body.textContent = answer
        messages.append(user, assistant, body)
        document.querySelector('#runStatus').textContent = status
        if (scenario.value === 'waiting') {
          const tool = document.createElement('div')
          tool.className = 'tool'
          tool.textContent = '◌ 外部工具 · 已请求，等待结果'
          messages.append(tool)
        }
      }
      function renderGuide() {
        const titles = ['连接服务', '验证访问', '开始使用']
        const bodies = [
          '检查服务是否可达。健康检查不会验证 Token 或模型。',
          '使用 API Token 验证受保护接口的访问权限。',
          '真实接入时仅展示已验证的状态。此处为交互演示。',
        ]
        document.querySelector('#steps').textContent =
          `${step + 1} / 3 · 连接服务 → 验证访问 → 开始使用`
        document.querySelector('#guideTitle').textContent = titles[step]
        document.querySelector('#guideBody').textContent = bodies[step]
        document.querySelector('#next').textContent = step === 2 ? '进入工作台' : '下一步'
      }
      document.querySelector('#theme').onclick = () =>
        (document.documentElement.dataset.theme =
          document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark')
      document.querySelector('#details').onclick = () => {
        nav.classList.remove('open')
        inspector.hidden = !inspector.hidden
        inspector.classList.toggle('open', !inspector.hidden)
      }
      document.querySelector('#closeDetails').onclick = () => {
        inspector.hidden = true
        inspector.classList.remove('open')
      }
      document.querySelector('#navToggle').onclick = () => {
        inspector.hidden = true
        inspector.classList.remove('open')
        nav.classList.toggle('open')
      }
      document.querySelector('#closeNav').onclick = () => nav.classList.remove('open')
      document.querySelector('#new').onclick = () => {
        scenario.value = 'empty'
        nav.classList.remove('open')
        render()
      }
      document.querySelector('#guide').onclick = () => {
        nav.classList.remove('open')
        inspector.classList.remove('open')
        renderGuide()
        wizard.showModal()
      }
      document.querySelector('#later').onclick = () => wizard.close()
      document.querySelector('#next').onclick = () => {
        if (step === 2) wizard.close()
        else {
          step++
          renderGuide()
        }
      }
      document.querySelector('#send').onclick = () => {
        scenario.value = 'streaming'
        render()
      }
      scenario.onchange = render
      render()
    </script>
  </body>
</html>
