openapi: 3.1.0
info:
  title: PrismAgentKit API
  version: 1.4.0
paths:
  /api/v1/health:
    get:
      tags:
      - system
      summary: 健康检查
      operationId: read_health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/sessions:
    get:
      tags:
      - sessions
      summary: 列出 Session
      operationId: list_sessions_api_v1_sessions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
    post:
      tags:
      - sessions
      summary: 创建 Session
      operationId: create_session_api_v1_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}/workspace:
    post:
      tags:
      - sessions
      summary: 绑定会话工作区
      operationId: bind_session_workspace_api_v1_sessions__session_id__workspace_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionWorkspaceUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}:
    get:
      tags:
      - sessions
      summary: 获取 Session
      operationId: get_session_api_v1_sessions__session_id__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}/messages:
    get:
      tags:
      - sessions
      summary: 获取 Session 消息
      operationId: list_messages_api_v1_sessions__session_id__messages_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}/compact:
    post:
      tags:
      - sessions
      summary: Compact Session
      description: 手动压缩空闲会话的上下文。
      operationId: compact_session_api_v1_sessions__session_id__compact_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Compact Session Api V1 Sessions  Session Id  Compact
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}/runs:
    post:
      tags:
      - runs
      summary: 创建 Run
      operationId: create_run_api_v1_sessions__session_id__runs_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}:
    get:
      tags:
      - runs
      summary: 获取 Run
      operationId: get_run_api_v1_runs__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}/cancel:
    post:
      tags:
      - runs
      summary: 取消 Run
      operationId: cancel_run_api_v1_runs__run_id__cancel_post
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}/tool-calls/{call_id}/result:
    post:
      tags:
      - runs
      summary: 提交远端工具结果
      operationId: submit_tool_result_api_v1_runs__run_id__tool_calls__call_id__result_post
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: call_id
        in: path
        required: true
        schema:
          type: string
          title: Call Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolResultRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCallView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}/tool-calls/{call_id}/preview:
    get:
      tags:
      - runs
      summary: 获取写入预览
      operationId: preview_tool_call_api_v1_runs__run_id__tool_calls__call_id__preview_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: call_id
        in: path
        required: true
        schema:
          type: string
          title: Call Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPreviewView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}/tool-calls/{call_id}/approval:
    post:
      tags:
      - runs
      summary: 审批写入
      operationId: decide_approval_api_v1_runs__run_id__tool_calls__call_id__approval_post
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: call_id
        in: path
        required: true
        schema:
          type: string
          title: Call Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}/events:
    get:
      tags:
      - runs
      summary: 订阅 Run 事件流
      operationId: stream_run_events_api_v1_runs__run_id__events_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: once
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Once
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last-Event-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tools:
    get:
      tags:
      - tools
      summary: 列出工具
      operationId: list_tools_api_v1_tools_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolListResponse'
  /api/v1/workspaces:
    get:
      tags:
      - workspaces
      summary: 列出工作区
      operationId: list_workspaces_api_v1_workspaces_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListResponse'
    post:
      tags:
      - workspaces
      summary: 绑定并激活工作区
      operationId: create_workspace_api_v1_workspaces_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/workspaces/pick:
    post:
      tags:
      - workspaces
      summary: 选择目录
      operationId: pick_workspace_api_v1_workspaces_pick_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePickResponse'
  /api/v1/workspaces/{workspace_id}:
    get:
      tags:
      - workspaces
      summary: 获取工作区
      operationId: get_workspace_api_v1_workspaces__workspace_id__get
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - workspaces
      summary: 删除工作区绑定
      operationId: delete_workspace_api_v1_workspaces__workspace_id__delete
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/workspaces/{workspace_id}/activate:
    post:
      tags:
      - workspaces
      summary: 切换活跃工作区
      operationId: activate_workspace_api_v1_workspaces__workspace_id__activate_post
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/workspaces/{workspace_id}/reindex:
    post:
      tags:
      - workspaces
      summary: 重建索引
      operationId: reindex_workspace_api_v1_workspaces__workspace_id__reindex_post
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/workspaces/{workspace_id}/tree:
    get:
      tags:
      - workspaces
      summary: 列出目录
      operationId: read_tree_api_v1_workspaces__workspace_id__tree_get
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      - name: path
        in: query
        required: false
        schema:
          type: string
          default: .
          title: Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/workspaces/{workspace_id}/file:
    get:
      tags:
      - workspaces
      summary: 读取文本文件
      operationId: read_file_api_v1_workspaces__workspace_id__file_get
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      - name: path
        in: query
        required: true
        schema:
          type: string
          title: Path
      - name: max_bytes
        in: query
        required: false
        schema:
          type: integer
          default: 65536
          title: Max Bytes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/workspaces/{workspace_id}/search:
    get:
      tags:
      - workspaces
      summary: 检索工作区
      operationId: search_workspace_api_v1_workspaces__workspace_id__search_get
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      - name: q
        in: query
        required: true
        schema:
          type: string
          title: Q
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      - name: path_prefix
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Path Prefix
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/mcp/servers:
    get:
      tags:
      - mcp
      summary: List Servers
      description: 返回全部 MCP 服务与工具数量。
      operationId: list_servers_api_v1_mcp_servers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/McpServerView'
                type: array
                title: Response List Servers Api V1 Mcp Servers Get
    post:
      tags:
      - mcp
      summary: Create Server
      description: 新增 MCP 服务。
      operationId: create_server_api_v1_mcp_servers_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpServerCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpServerView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/mcp/servers/{server_id}:
    patch:
      tags:
      - mcp
      summary: Update Server
      description: 更新 MCP 服务配置。
      operationId: update_server_api_v1_mcp_servers__server_id__patch
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpServerCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpServerView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - mcp
      summary: Delete Server
      description: 删除 MCP 服务：先断开连接并释放工具。
      operationId: delete_server_api_v1_mcp_servers__server_id__delete
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/mcp/servers/{server_id}/enable:
    post:
      tags:
      - mcp
      summary: Enable Server
      description: 启用并连接 MCP 服务。
      operationId: enable_server_api_v1_mcp_servers__server_id__enable_post
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpServerView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/mcp/servers/{server_id}/disable:
    post:
      tags:
      - mcp
      summary: Disable Server
      description: 禁用并断开 MCP 服务。
      operationId: disable_server_api_v1_mcp_servers__server_id__disable_post
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpServerView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/mcp/servers/{server_id}/reconnect:
    post:
      tags:
      - mcp
      summary: Reconnect Server
      description: 重连 MCP 服务并刷新工具。
      operationId: reconnect_server_api_v1_mcp_servers__server_id__reconnect_post
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpServerView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/mcp/servers/{server_id}/tools:
    get:
      tags:
      - mcp
      summary: List Server Tools
      description: 返回该服务当前已注册的工具目录。
      operationId: list_server_tools_api_v1_mcp_servers__server_id__tools_get
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpToolsView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/skills:
    get:
      tags:
      - skills
      summary: List Skills
      description: 返回全部技能条目（含被同名遮蔽项）。
      operationId: list_skills_api_v1_skills_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillsView'
  /api/v1/skills/{name}:
    get:
      tags:
      - skills
      summary: Get Skill
      description: 返回单个技能的正文与资源清单。
      operationId: get_skill_api_v1_skills__name__get
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDetailView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/model-profiles:
    get:
      tags:
      - model-profiles
      summary: List Profiles
      description: 返回全部档案与激活标记。
      operationId: list_profiles_api_v1_model_profiles_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ModelProfileView'
                type: array
                title: Response List Profiles Api V1 Model Profiles Get
    post:
      tags:
      - model-profiles
      summary: Create Profile
      description: 新增模型档案。
      operationId: create_profile_api_v1_model_profiles_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelProfileCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProfileView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/model-profiles/{profile_id}:
    patch:
      tags:
      - model-profiles
      summary: Update Profile
      description: 更新模型档案。
      operationId: update_profile_api_v1_model_profiles__profile_id__patch
      parameters:
      - name: profile_id
        in: path
